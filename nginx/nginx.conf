worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON Access Log matching Pino Observability Format
    log_format pino_json escape=json
      '{"level":30,"time":"$time_iso8601","service":"ims-nginx-gateway",'
      '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_addr":"$upstream_addr",'
      '"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher"}';

    access_log /var/log/nginx/access.log pino_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 10M;

    # -------------------------------------------------------------------------
    # 1. Rate Limiting Zones (Specification Section 2 & 3.1)
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_kyc_limit:10m rate=5r/s;
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # 2. IP Whitelisting Policy (Specification Section 2 & 3.1)
    # -------------------------------------------------------------------------
    geo $ip_allowed {
        default        0;
        127.0.0.1/32   1;
        ::1/128        1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
    }

    # -------------------------------------------------------------------------
    # 3. Upstream Load Balancer Pools (least_conn Traffic Distribution)
    # -------------------------------------------------------------------------
    upstream backend_cluster {
        least_conn;
        server backend-1:8080 max_fails=3 fail_timeout=15s;
        server backend-2:8080 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream frontend_cluster {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # 4. HTTP (Port 80 / 8080) -> Redirect to HTTPS (TLS 1.3) + Health Probe
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost ims.local;

        location = /nginx-health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"nginx-load-balancer"}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # 5. HTTPS API Gateway & Load Balancer (Port 443 - TLS 1.3 Enforced)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost ims.local;

        # TLS 1.3 Configuration (Specification Section 2, 3.1 & 5.2)
        ssl_certificate     /etc/nginx/certs/ims.crt;
        ssl_certificate_key /etc/nginx/certs/ims.key;
        ssl_protocols       TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Enforce IP Whitelist
        if ($ip_allowed = 0) {
            return 403 '{"detail":"Access denied by API Gateway IP Whitelist policy."}';
        }

        # Mandatory OWASP Top 10 Security Headers (CSP & HSTS - Section 2 & 3.1)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://localhost; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Gateway-TLS-Protocol $ssl_protocol always;

        # Strict Rate-Limited Auth & KYC Endpoints
        location ~ ^/api/v1/(auth|kyc)/ {
            limit_req zone=auth_kyc_limit burst=15 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Upstream-Backend $upstream_addr always;
        }

        # General FastAPI Backend Routes
        location /api/v1/ {
            limit_req zone=api_rate_limit burst=40 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Upstream-Backend $upstream_addr always;
        }

        # Backend Health Endpoint
        location = /health {
            proxy_pass http://backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header X-Upstream-Backend $upstream_addr always;
        }

        # Next.js Frontend Portal
        location / {
            limit_req zone=api_rate_limit burst=60 nodelay;

            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}