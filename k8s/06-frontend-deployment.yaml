apiVersion: v1
kind: Service
metadata:
  name: ims-frontend-service
  namespace: ims-production
spec:
  selector:
    app: ims-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-frontend
  namespace: ims-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ims-frontend
  template:
    metadata:
      labels:
        app: ims-frontend
    spec:
      containers:
        - name: frontend
          image: ims-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_INTERNAL_URL
              value: "http://ims-backend-service:8080"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"