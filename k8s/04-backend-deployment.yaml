apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ims-encrypted-docs-pvc
  namespace: ims-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ims-backend-service
  namespace: ims-production
spec:
  selector:
    app: ims-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-backend
  namespace: ims-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ims-backend
  template:
    metadata:
      labels:
        app: ims-backend
    spec:
      containers:
        - name: backend
          image: ims-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "ims-kafka-service:9092"
            - name: ENCRYPTED_STORAGE_DIR
              value: "/app/storage/encrypted_docs"
          envFrom:
            - configMapRef:
                name: ims-config
            - secretRef:
                name: ims-secrets
          volumeMounts:
            - name: encrypted-storage
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: encrypted-storage
          persistentVolumeClaim:
            claimName: ims-encrypted-docs-pvc