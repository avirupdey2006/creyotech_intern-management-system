apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ims-backend-hpa
  namespace: ims-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ims-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ims-frontend-hpa
  namespace: ims-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ims-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80