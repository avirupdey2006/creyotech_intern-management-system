apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-config
  namespace: ims-production
data:
  ENVIRONMENT: "development"
  APP_NAME: "Intern Management System"
  API_V1_STR: "/api/v1"
  BACKEND_CORS_ORIGINS: '["http://localhost:3000","https://localhost","https://ims.vercel.app"]'
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "strict"
  SIGNED_URL_EXPIRY_SECONDS: "300"
  KYC_PROVIDER: "MOCK"
  KYC_API_BASE_URL: "https://sandbox.cashfree.com/verification"
  KAFKA_BOOTSTRAP_SERVERS: "ims-kafka-service:9092"
  KAFKA_TOPIC_DOCUMENT_GENERATION: "intern.document.generate"
  KAFKA_TOPIC_EMAIL_NOTIFICATION: "intern.notification.email"
  KAFKA_CONSUMER_GROUP: "ims-backend-workers"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "noreply@ims.local"
  EMAIL_DAILY_LIMIT: "100"
  ENCRYPTED_STORAGE_DIR: "/app/storage/encrypted_docs"
  LOG_LEVEL: "INFO"
  BACKEND_INTERNAL_URL: "http://ims-backend-service:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-nginx-config
  namespace: ims-production
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events {
        worker_connections 2048;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile      on;
        server_tokens off;
        client_max_body_size 10M;

        limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;
        limit_req_zone $binary_remote_addr zone=auth_kyc_limit:10m rate=5r/s;
        limit_req_status 429;

        upstream backend_cluster {
            least_conn;
            server ims-backend-service:8080;
        }

        upstream frontend_cluster {
            least_conn;
            server ims-frontend-service:3000;
        }

        server {
            listen 80;
            server_name localhost;
            location = /nginx-health {
                return 200 '{"status":"healthy","gateway":"k8s-nginx-lb"}\n';
                add_header Content-Type application/json;
            }
            location / {
                return 301 https://$host$request_uri;
            }
        }

        server {
            listen 443 ssl;
            http2 on;
            server_name localhost;

            ssl_certificate     /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols       TLSv1.3 TLSv1.2;
            ssl_prefer_server_ciphers on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://localhost; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Gateway-TLS-Protocol $ssl_protocol always;

            location ~ ^/api/v1/(auth|kyc)/ {
                limit_req zone=auth_kyc_limit burst=15 nodelay;
                proxy_pass http://backend_cluster;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                add_header X-Upstream-Backend $upstream_addr always;
            }

            location /api/v1/ {
                limit_req zone=api_rate_limit burst=40 nodelay;
                proxy_pass http://backend_cluster;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                add_header X-Upstream-Backend $upstream_addr always;
            }

            location = /health {
                proxy_pass http://backend_cluster/health;
                proxy_set_header Host $host;
                add_header X-Upstream-Backend $upstream_addr always;
            }

            location / {
                proxy_pass http://frontend_cluster;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }