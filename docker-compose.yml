services:
  # ---------------------------------------------------------------------------
  # 1. Apache Kafka Event Streaming Broker (KRaft Mode - No ZooKeeper needed)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: ims-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ims-net

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend Replica 1
  # ---------------------------------------------------------------------------
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ims-backend:latest
    container_name: ims-backend-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENCRYPTED_STORAGE_DIR: /app/storage/encrypted_docs
    volumes:
      - ims_encrypted_storage:/app/storage
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ims-net

  # ---------------------------------------------------------------------------
  # 3. FastAPI Backend Replica 2 (For Load Balancer Distribution)
  # ---------------------------------------------------------------------------
  backend-2:
    image: ims-backend:latest
    container_name: ims-backend-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENCRYPTED_STORAGE_DIR: /app/storage/encrypted_docs
    volumes:
      - ims_encrypted_storage:/app/storage
    depends_on:
      backend-1:
        condition: service_healthy
    networks:
      - ims-net

  # ---------------------------------------------------------------------------
  # 4. Dedicated Kafka Background Worker (PDF Generation & Email Dispatch)
  # ---------------------------------------------------------------------------
  kafka-worker:
    image: ims-backend:latest
    container_name: ims-kafka-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.kafka_consumer"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENCRYPTED_STORAGE_DIR: /app/storage/encrypted_docs
    volumes:
      - ims_encrypted_storage:/app/storage
    depends_on:
      kafka:
        condition: service_healthy
      backend-1:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - ims-net

  # ---------------------------------------------------------------------------
  # 5. Next.js Frontend Portal
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend-1:8080
    image: ims-frontend:latest
    container_name: ims-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend-1:8080
    depends_on:
      backend-1:
        condition: service_healthy
    networks:
      - ims-net

  # ---------------------------------------------------------------------------
  # 6. Nginx API Gateway & Load Balancer (TLS 1.3 + OWASP CSP/HSTS)
  # ---------------------------------------------------------------------------
  nginx-lb:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ims-nginx-lb:latest
    container_name: ims-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ims-net

volumes:
  ims_encrypted_storage:

networks:
  ims-net:
    driver: bridge